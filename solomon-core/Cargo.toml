[package]
name = "solomon-core"
version = "0.1.0"
edition = "2021"
description = "Post-Quantum Digital Signature Algorithm ML-DSA-65 (FIPS 204) - Pure Rust Implementation"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "post-quantum", "dsa", "ml-dsa", "nist"]
categories = ["cryptography", "no-std"]
repository = "https://github.com/your-repo/ml-dsa-65"
readme = "README.md"

[dependencies]
# Core dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
ed25519-dalek = "2.0"
tracing = "0.1"
socket2 = "0.5"
sha2 = "0.10"
thiserror = "1.0"
hex = "0.4"
solomon-zk = { path = "../solomon-zk" }

# Optional proxy dependencies
axum = { version = "0.7", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
mac_address = { version = "1.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
ml-kem = { version = "0.2", optional = true }
hybrid-array = { version = "0.2", optional = true }
rand_core = { version = "0.6", optional = true }
rand = { version = "0.8", optional = true }
curve25519-dalek = { version = "4.1", default-features = false, optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
sha3 = { version = "0.10.8", default-features = false }

[features]
default = ["std"]
std = []
# Enable this feature if you want to use SIMD optimizations
simd = []
# Enable this feature to build the on-premises tethered proxy server
proxy = [
    "std",
    "dep:axum",
    "dep:reqwest",
    "dep:mac_address",
    "dep:tracing-subscriber",
    "dep:chrono",
    "dep:ml-kem",
    "dep:hybrid-array",
    "dep:rand_core",
    "dep:rand",
    "dep:curve25519-dalek",
    "dep:tokio-rustls",
    "dep:rustls-pemfile"
]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
rand = "0.8"
reqwest = "0.12"
hex = { version = "0.4", features = ["serde"] }
tempfile = "3"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "iso8583_bench"
harness = false
required-features = ["proxy"]

[[bench]]
name = "ai_and_zk_bench"
harness = false
required-features = ["proxy"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = "s"
panic = "abort"